name: xPay staging checks
on:
  pull_request:
    paths:
      - 'mvp/**'
      - '.github/workflows/xpay-staging-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: TypeScript checks
        run: npm run check
      - name: Production frontend build
        run: npm run build
